<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Gastos</title>
    <link
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .form-container {
        max-width: 500px;
        margin: auto;
        margin-top: 50px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="form-container">
        <h4 class="text-center mb-4">Registro de Gastos</h4>
        <form id="submit-to-google-sheet">
          <div class="form-group">
            <label for="date">Fecha:</label>
            <input
              class="form-control"
              type="date"
              name="Date"
              id="date"
              required
            />
          </div>

          <div class="form-group">
            <label for="description">Descripción:</label>
            <input
              class="form-control"
              type="text"
              name="Description"
              id="description"
              required
            />
          </div>

          <div class="form-group">
            <label for="importe">Importe:</label>
            <input
              class="form-control"
              type="number"
              step="1"
              name="Importe"
              id="importe"
              required
            />
          </div>

          <div class="form-group">
            <label for="tipo">Tipo:</label><br />
            <div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="Tipo"
                  id="fixed"
                  value="Fixed"
                  required
                />
                <label class="form-check-label" for="fixed">Fixed</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="Tipo"
                  id="needs"
                  value="Needs"
                />
                <label class="form-check-label" for="needs">Needs</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="Tipo"
                  id="wants"
                  value="Wants"
                />
                <label class="form-check-label" for="wants">Wants</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="Tipo"
                  id="income"
                  value="Income"
                />
                <label class="form-check-label" for="income">Income</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="expenseCategory">Categoría:</label>
            <select
              class="form-control"
              name="Expense Category"
              id="expenseCategory"
              required
            >
              <option value="" disabled selected>Seleccione un tipo primero</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Enviar</button>
        </form>
      </div>
    </div>

    <script>
      // FECHA POR DEFECTO HOY
      document.getElementById("date").valueAsDate = new Date();

      const categorias = {
        Fixed: [
          "Alquiler", "Plaza parking", "Hipoteca", "Préstamos", "Seguros",
          "Facturas", "Limpieza Casa", "Impuestos"
        ],
        Needs: [
          "Hogar", "Gimnasio", "Compra Comida", "Comidas trabajo",
          "Factura Móvil", "Transporte", "Talleres", "Médicos",
          "Inversiones", "Otros imprevistos"
        ],
        Wants: [
          "Cenas", "Fiesta", "Viajes", "Ropa", "Libros", "Otras",
          "Compras", "Regalos", "Bodas", "Golf", "Deportes", "Otro ocio"
        ],
        Income: [
          "Salario", "Bonus", "Otros ingresos"
        ]
      };

      // CAMBIAR CATEGORÍAS SEGÚN EL TIPO SELECCIONADO
      const tipoRadios = document.querySelectorAll("input[name='Tipo']");
      const categoriaSelect = document.getElementById("expenseCategory");

      tipoRadios.forEach(radio => {
        radio.addEventListener("change", function () {
          const selectedTipo = this.value;
          const options = categorias[selectedTipo] || [];

          categoriaSelect.innerHTML = "";
          options.forEach(cat => {
            const option = document.createElement("option");
            option.value = cat;
            option.text = cat;
            categoriaSelect.appendChild(option);
          });
        });
      });

      // ENVÍO A GOOGLE SHEETS
      const scriptURL = "https://script.google.com/macros/s/AKfycbysY4UkeX96uW3Dd1zew0ijykNZkJeIZ_JCs4aD7zZhfLHBB1yi2pGs4xVT-MzuIY95/exec"; // ← Cambia esto por tu URL real
      const form = document.getElementById("submit-to-google-sheet");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(form);

        const tipo = formData.get("Tipo");
        let importe = parseInt(formData.get("Importe"), 10);

        if (["Fixed", "Needs", "Wants"].includes(tipo)) {
          importe *= -1;
        }

        formData.set("Importe", importe.toString());

        fetch(scriptURL, { method: "POST", body: formData })
          .then((response) => {
            Swal.fire("Éxito", "Registro guardado correctamente.", "success");
            form.reset();
            categoriaSelect.innerHTML = "<option value='' disabled selected>Seleccione un tipo primero</option>";
            document.getElementById("date").valueAsDate = new Date();
          })
          .catch((error) => {
            console.error("Error:", error);
            Swal.fire("Error", "Hubo un problema al enviar los datos.", "error");
          });
      });
    </script>
  </body>
</html>
